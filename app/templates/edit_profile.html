
{% extends "base.html" %}

{% block title %}Edit Profile | EMP{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-primary text-white py-3">
                    <h3 class="mb-0">Edit Profile</h3>
                </div>

                <div class="card-body p-4">
                    <p class="text-secondary mb-4">
                        Update your personal information below.
                    </p>

                    <form method="POST"
                          action="{{ url_for('main.edit_profile') }}">

                        <input type="hidden"
                               name="csrf_token"
                               value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="name" class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="name"
                                   name="name"
                                   maxlength="100"
                                   value="{{ name if name is defined else current_user.name }}"
                                   autocomplete="name"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="email" class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   maxlength="150"
                                   value="{{ email if email is defined else current_user.email }}"
                                   autocomplete="email"
                                   required>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <button type="submit"
                                    class="btn btn-success">
                                Save Changes
                            </button>

                            <a href="{{ url_for('main.student_profile') }}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
