
{% extends "base.html" %}

{% block title %}Register | Examination Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Create an Account</h2>

                <form method="POST">
                    <input type="hidden" name="csrf_token"
                           value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name"
                               class="form-control" required
                               maxlength="100">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email"
                               class="form-control" required
                               maxlength="150">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password"
                               class="form-control" required
                               minlength="8">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Register As</label>
                        <select name="role" class="form-select" required>
                            <option value="student">Student</option>
                            <option value="examiner">Examiner</option>
                        </select>
                    </div>

                    <p class="small text-secondary mb-2">
                        Examiners only (required when registering as an
                        examiner):
                    </p>

                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" name="department"
                               class="form-control" maxlength="100"
                               placeholder="e.g. Computer Science">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contact Details</label>
                        <input type="text" name="contact_details"
                               class="form-control" maxlength="150"
                               placeholder="Phone number or alternate email">
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Register
                    </button>
                </form>

                <p class="text-center mt-3 mb-0">
                    Already registered?
                    <a href="{{ url_for('main.login') }}">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
