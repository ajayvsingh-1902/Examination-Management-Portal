
{% extends "base.html" %}

{% block title %}Edit Rubric Criterion{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold">Edit Rubric Criterion</h2>
                    <p class="text-secondary mb-0">
                        Update the assessment criteria for this examination.
                    </p>
                </div>
                <a href="{{ url_for('main.manage_rubrics') }}"
                   class="btn btn-outline-secondary">
                    Back
                </a>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Examination</label>
                        <input type="text"
                               class="form-control"
                               value="{{ rubric.examination.title }}"
                               readonly>
                        <small class="text-secondary">
                            The examination cannot be changed here.
                        </small>
                    </div>

                    <form method="POST"
                          action="{{ url_for('main.edit_rubric', rubric_id=rubric.id) }}">

                        <input type="hidden" name="csrf_token"
                               value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="criterion_name"
                                   class="form-label">Criterion Name</label>
                            <input type="text"
                                   name="criterion_name"
                                   id="criterion_name"
                                   class="form-control"
                                   maxlength="150"
                                   value="{{ rubric.criterion_name }}"
                                   required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="max_marks"
                                       class="form-label">Maximum Marks</label>
                                <input type="number"
                                       name="max_marks"
                                       id="max_marks"
                                       class="form-control"
                                       min="0.01"
                                       step="0.01"
                                       value="{{ rubric.max_marks }}"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="weightage"
                                       class="form-label">Weightage</label>
                                <input type="number"
                                       name="weightage"
                                       id="weightage"
                                       class="form-control"
                                       min="0.01"
                                       step="0.01"
                                       value="{{ rubric.weightage }}"
                                       required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="description"
                                   class="form-label">Description</label>
                            <textarea name="description"
                                      id="description"
                                      class="form-control"
                                      rows="4"
                                      maxlength="2000"
                                      placeholder="Describe how this criterion is assessed">{{ rubric.description or "" }}</textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Save Changes
                        </button>

                        <a href="{{ url_for('main.manage_rubrics') }}"
                           class="btn btn-outline-secondary ms-2">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
